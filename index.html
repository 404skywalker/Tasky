<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="tomato">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dc4c3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasky">
<meta name="application-name" content="Tasky">
<title>Tasky — Task Manager</title>
<style>
:root{
  --accent:#dc4c3e; --accent-hover:#c53727;
  --bg:#ffffff; --bg-alt:#faf9f8; --sidebar:#fcfaf9;
  --text:#1f1f1f; --text-soft:#666461; --text-faint:#9b9691;
  --border:#eeece9; --border-strong:#e2ded9;
  --hover:#f4f2f0; --sel:#fff0e9;
  --p1:#d1453b; --p2:#eb8909; --p3:#246fe0; --p4:#b0b0b0;
  --green:#058527; --blue:#246fe0;
  --shadow:0 2px 8px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 34px rgba(0,0,0,.18);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#1e1e1e; --bg-alt:#252525; --sidebar:#282828;
  --text:#e9e7e4; --text-soft:#a8a5a1; --text-faint:#787571;
  --border:#383838; --border-strong:#464646;
  --hover:#323232; --sel:#3a2a24;
  --p4:#8a8a8a; --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-lg:0 10px 34px rgba(0,0,0,.55);
}
[data-accent="tomato"]{--accent:#dc4c3e;--accent-hover:#c53727}
[data-accent="blue"]{--accent:#2f6fed;--accent-hover:#255fd0;--sel:#e8f0ff}
[data-accent="violet"]{--accent:#7c4dff;--accent-hover:#6a3ce0;--sel:#f0eaff}
[data-accent="green"]{--accent:#0f9d58;--accent-hover:#0c854a;--sel:#e6f6ee}
[data-accent="pink"]{--accent:#e0518f;--accent-hover:#cc4180;--sel:#ffeaf3}
[data-accent="teal"]{--accent:#0f9aa8;--accent-hover:#0c8391;--sel:#e3f6f8}
[data-theme="dark"][data-accent="blue"]{--sel:#233246}
[data-theme="dark"][data-accent="violet"]{--sel:#2c2444}
[data-theme="dark"][data-accent="green"]{--sel:#1c3327}
[data-theme="dark"][data-accent="pink"]{--sel:#3a2430}
[data-theme="dark"][data-accent="teal"]{--sel:#173135}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block}
.app{display:flex;height:100vh;height:100dvh}
.hidden{display:none!important}

/* Sidebar */
.sidebar{width:290px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .22s}
.sb-head{display:flex;align-items:center;gap:6px;padding:12px 12px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--accent)}
.brand svg{width:22px;height:22px}
.sb-head .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.sb-search{margin:2px 12px 6px;display:flex;align-items:center;gap:8px;background:var(--hover);border-radius:9px;padding:7px 10px;color:var(--text-faint);cursor:text}
.sb-search svg{width:16px;height:16px}
.sb-search span{font-size:13px}
.sb-search kbd{margin-left:auto;font-size:10px;background:var(--bg);border:1px solid var(--border-strong);border-radius:4px;padding:1px 5px;color:var(--text-faint)}
.sb-scroll{flex:1;overflow-y:auto;padding:2px 8px 24px}
.add-task-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;color:var(--accent);font-weight:600;margin:2px 0 4px}
.add-task-btn:hover{background:var(--hover)}
.add-task-btn .plus{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:8px;color:var(--text);cursor:pointer;user-select:none;position:relative}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--sel);font-weight:600}
.nav-item .ni-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-soft)}
.nav-item.active .ni-icon{color:var(--accent)}
.nav-item .ni-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ni-count{color:var(--text-faint);font-size:12px}
.nav-item svg{width:18px;height:18px}
.nav-item .star{opacity:0;color:var(--text-faint)}
.nav-item:hover .star{opacity:.55}
.nav-item .star.on{opacity:1;color:#f5b301}
.proj-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.sb-section{margin-top:14px}
.sb-section-head{display:flex;align-items:center;gap:4px;padding:5px 6px;color:var(--text-soft);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.sb-section-head .spacer{flex:1}
.sb-section-head .h-btn{opacity:0;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-soft)}
.sb-section-head:hover .h-btn{opacity:1}
.sb-section-head .h-btn:hover{background:var(--hover)}
.caret{transition:transform .15s;width:14px;height:14px;color:var(--text-faint);flex-shrink:0}
.caret.collapsed{transform:rotate(-90deg)}
.tree-row .del-x{opacity:0;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.tree-row:hover .del-x{opacity:.65}
.tree-row .del-x:hover{background:var(--border-strong);opacity:1}
.child-caret{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:-4px;border-radius:4px}
.child-caret:hover{background:var(--border-strong)}
.child-caret.empty{visibility:hidden}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:6px;padding:9px 14px;min-height:48px;border-bottom:1px solid transparent}
.topbar .menu-toggle{display:none}
.topbar .crumb{font-size:13px;color:var(--text-faint);display:flex;align-items:center;gap:6px;min-width:0}
.topbar .crumb b{color:var(--text-soft);font-weight:600}
.topbar .spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;color:var(--text-soft);font-size:13px}
.tb-btn:hover{background:var(--hover);color:var(--text)}
.tb-btn svg{width:16px;height:16px}
.content{flex:1;overflow-y:auto;padding:6px 0 100px}
.container{max-width:800px;margin:0 auto;padding:0 24px}
.container.wide{max-width:1200px}
.view-head{padding:12px 0 4px}
.view-title{font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.view-title .vt-emoji{font-size:20px}
.view-sub{color:var(--text-faint);font-size:13px;margin-top:2px}
.view-actions{display:flex;gap:4px;margin-left:auto}

/* task rows */
.section-block{margin-top:6px}
.section-label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:12px 0 4px;border-bottom:1px solid var(--border);margin-bottom:2px}
.section-label .sl-count{color:var(--text-faint);font-weight:500}
.section-label .caret{cursor:pointer}
.section-label .sec-actions{margin-left:auto;display:flex;gap:2px;opacity:0}
.section-label:hover .sec-actions{opacity:1}
.task{display:flex;gap:10px;padding:8px 6px 8px 2px;border-bottom:1px solid var(--border);align-items:flex-start;position:relative;border-radius:6px}
.task:hover{background:var(--bg-alt)}
.task.dragging{opacity:.35}
.task.drop-above::before{content:"";position:absolute;top:-1px;left:34px;right:0;height:2px;background:var(--accent);border-radius:2px}
.task.drop-child::after{content:"";position:absolute;bottom:-1px;left:52px;right:0;height:2px;background:var(--blue);border-radius:2px}
.task.selected{background:var(--sel)}
.sel-box{width:18px;height:18px;border:1.5px solid var(--text-faint);border-radius:5px;flex-shrink:0;margin-top:3px;display:none;align-items:center;justify-content:center;cursor:pointer}
body.multiselect .sel-box{display:flex}
body.multiselect .drag-handle{display:none}
.sel-box.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sel-box svg{width:12px;height:12px;opacity:0}
.sel-box.on svg{opacity:1}
.checkbox{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--text-faint);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;position:relative}
.checkbox:hover{transform:scale(1.08)}
.checkbox svg{width:12px;height:12px;opacity:0;transition:.12s;color:#fff}
.checkbox:hover svg{opacity:.5;color:var(--text-faint)}
.checkbox.p1{border-color:var(--p1);background:rgba(209,69,59,.09)}
.checkbox.p2{border-color:var(--p2);background:rgba(235,137,9,.09)}
.checkbox.p3{border-color:var(--p3);background:rgba(36,111,224,.09)}
.checkbox.done{background:var(--text-faint);border-color:var(--text-faint)}
.checkbox.done.p1{background:var(--p1);border-color:var(--p1)}
.checkbox.done.p2{background:var(--p2);border-color:var(--p2)}
.checkbox.done.p3{background:var(--p3);border-color:var(--p3)}
.checkbox.done svg{opacity:1;color:#fff}
.task-body{flex:1;min-width:0}
.task-title{cursor:pointer;word-break:break-word}
.task-title .recur-ico{display:inline-block;vertical-align:-2px;margin-left:4px;color:var(--text-faint)}
.task.done .task-title{color:var(--text-faint);text-decoration:line-through}
.task-desc{color:var(--text-faint);font-size:12.5px;margin-top:1px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;align-items:center}
.meta-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-soft)}
.meta-pill svg{width:13px;height:13px}
.due.today{color:var(--green)}
.due.overdue{color:var(--accent)}
.due.soon{color:var(--p2)}
.deadline{color:#b3541e}
.label-tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text-soft)}
.label-tag .ld{width:8px;height:8px;border-radius:50%}
.task-actions{display:flex;gap:1px;opacity:0;align-self:flex-start;margin-top:-1px}
.task:hover .task-actions{opacity:1}
.task-actions button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-soft)}
.task-actions button:hover{background:var(--border-strong);color:var(--text)}
.task-actions svg{width:16px;height:16px}
.drag-handle{cursor:grab;color:var(--text-faint);opacity:0;display:flex;align-items:center;margin-top:2px;width:14px;flex-shrink:0}
.task:hover .drag-handle{opacity:.55}
.twist{width:18px;height:18px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--text-faint)}
.twist:hover{background:var(--border-strong)}
.twist.empty{visibility:hidden}
.child-wrap{margin-left:30px}
.sub-count{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text-soft)}

/* add task */
.add-row{margin:4px 0}
.add-inline-trigger{display:flex;align-items:center;gap:10px;padding:8px 6px;color:var(--text-faint);cursor:pointer;border-radius:8px;width:100%}
.add-inline-trigger:hover{color:var(--accent)}
.add-inline-trigger .pc{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.add-inline-trigger:hover .pc{background:var(--accent);color:#fff}
.add-inline-trigger .pc svg{width:14px;height:14px}
.compose{border:1px solid var(--border-strong);border-radius:12px;padding:12px;margin:6px 0;box-shadow:var(--shadow);background:var(--bg)}
.compose input.c-title{width:100%;border:none;outline:none;font-size:15px;font-weight:500;background:transparent}
.compose textarea.c-desc{width:100%;border:none;outline:none;resize:none;margin-top:4px;color:var(--text-soft);background:transparent;font-size:13px}
.compose-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ctool{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-strong);border-radius:7px;padding:4px 9px;font-size:12.5px;color:var(--text-soft);background:var(--bg)}
.ctool:hover{background:var(--hover)}
.ctool svg{width:14px;height:14px}
.ctool.set{border-color:currentColor}
.compose-foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.compose-foot .spacer{flex:1}
.proj-select{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:7px;padding:5px 10px;font-size:13px;color:var(--text-soft)}
.proj-select:hover{background:var(--hover)}
.btn{padding:7px 15px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{background:var(--text-faint);cursor:not-allowed}
.btn-ghost{background:var(--hover);color:var(--text-soft)}
.btn-ghost:hover{background:var(--border-strong)}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.6}
.hint code{background:var(--hover);padding:1px 5px;border-radius:4px;font-size:11px}

.empty-state{text-align:center;padding:56px 20px;color:var(--text-faint)}
.empty-state svg{width:66px;height:66px;opacity:.5;margin-bottom:12px;margin-left:auto;margin-right:auto}
.empty-state h3{color:var(--text-soft);font-weight:600;margin-bottom:4px}

/* Board */
.board{display:flex;gap:12px;overflow-x:auto;padding:12px 0 24px;align-items:flex-start}
.board-col{background:var(--bg-alt);border:1px solid var(--border);border-radius:14px;width:264px;flex-shrink:0;max-height:calc(100vh - 190px);display:flex;flex-direction:column;transition:border-color .15s}
.board-col-head{display:flex;align-items:center;gap:7px;padding:12px 13px 8px;font-weight:700;font-size:12px;letter-spacing:.02em}
.board-col-head .bc-count{background:var(--hover);color:var(--text-soft);font-weight:600;font-size:11px;border-radius:20px;padding:1px 8px;line-height:1.6}
.board-col-head .sec-actions{margin-left:auto;opacity:0}
.board-col-head:hover .sec-actions{opacity:1}
.board-col-body{overflow-y:auto;padding:2px 9px 8px;flex:1}
.board-card{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:9px 11px 9px 12px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease}
.board-card:hover{border-color:var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-1px)}
[data-theme="dark"] .board-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.board-card.dragging{opacity:.4;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.board-card.pa1{border-left:3px solid var(--p1)}
.board-card.pa2{border-left:3px solid var(--p2)}
.board-card.pa3{border-left:3px solid var(--p3)}
.bc-top{display:flex;gap:9px;align-items:flex-start}
.bc-title{flex:1;font-size:13.5px;font-weight:500;line-height:1.38;word-break:break-word}
.board-card.done .bc-title{text-decoration:line-through;color:var(--text-faint)}
.board-add{padding:8px 10px;color:var(--text-faint);font-size:12.5px;cursor:pointer;border-radius:9px;display:flex;gap:8px;align-items:center;margin-top:2px}
.board-add:hover{color:var(--accent);background:var(--hover)}
.board-col.drop{outline:2px dashed var(--accent);outline-offset:-3px}
@media(max-width:820px){ .board-col{width:82vw;max-width:320px} }

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:12px}
.cal-dow{background:var(--bg-alt);padding:7px 8px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-faint);text-align:center}
.cal-cell{background:var(--bg);min-height:104px;padding:5px 6px;cursor:pointer;position:relative}
.cal-cell:hover{background:var(--bg-alt)}
.cal-cell.other{background:var(--bg-alt);color:var(--text-faint)}
.cal-cell.today .cal-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-num{font-size:12.5px;font-weight:600;margin-bottom:3px}
.cal-task{font-size:11px;background:var(--sel);border-radius:5px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:4px}
.cal-task .cd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-more{font-size:10.5px;color:var(--text-faint);padding-left:4px}
.cal-head{display:flex;align-items:center;gap:10px;margin-top:10px}
.cal-head h2{font-size:17px;font-weight:700}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:8px;font-weight:700}
.stat-big{font-size:32px;font-weight:800;line-height:1}
.stat-sub{color:var(--text-faint);font-size:12.5px;margin-top:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:6px}
.heat-cell{width:12px;height:12px;border-radius:3px;background:var(--hover)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative;opacity:.85}
.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-faint)}
.ring{--val:0}
.goal-row{display:flex;align-items:center;gap:10px;margin-top:8px}

/* Popover / menu */
.pop-backdrop{position:fixed;inset:0;z-index:100}
.popover{position:fixed;z-index:101;background:var(--bg);border:1px solid var(--border-strong);border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;max-height:70vh;overflow-y:auto}
.pop-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;cursor:pointer;width:100%;text-align:left;font-size:13.5px}
.pop-item:hover{background:var(--hover)}
.pop-item svg{width:17px;height:17px;flex-shrink:0}
.pop-item.danger{color:var(--accent)}
.pop-item .pi-right{margin-left:auto;color:var(--text-faint);font-size:12px}
.pop-item .pdot{width:12px;height:12px;border-radius:50%}
.pop-div{height:1px;background:var(--border);margin:5px 2px}
.pop-title{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-faint);padding:6px 9px 3px;letter-spacing:.04em}
.pop-input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;outline:none;background:var(--bg-alt);margin-bottom:6px}
.pop-input:focus{border-color:var(--accent)}
.check-tick{margin-left:auto;color:var(--accent)}
.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px}
.color-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-swatch.sel{border-color:var(--text)}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--text-soft)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.disp-row{display:flex;align-items:center;gap:10px;padding:6px 2px}
.disp-row>span:first-child{flex:1;font-size:13.5px}
.disp-row select{border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--text);font-size:13px;min-width:150px;cursor:pointer}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--border-strong);border-radius:20px;transition:.2s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(18px)}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;max-height:86vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.modal-head .spacer{flex:1}
.modal-body{padding:14px 18px 22px}
.detail-title-row{display:flex;gap:12px;align-items:flex-start}
.detail-title{font-size:19px;font-weight:700;flex:1;border:none;outline:none;background:transparent;resize:none;line-height:1.3;overflow:hidden}
.detail-desc{width:100%;border:1px solid transparent;border-radius:8px;padding:8px;margin-top:6px;outline:none;resize:vertical;min-height:48px;background:transparent;color:var(--text-soft);font-size:13.5px}
.detail-desc:hover,.detail-desc:focus{border-color:var(--border-strong);background:var(--bg-alt)}
.detail-props{margin-top:14px;border-top:1px solid var(--border);padding-top:6px}
.prop-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--border)}
.prop-row .pk{width:92px;color:var(--text-faint);font-size:13px;flex-shrink:0}
.prop-row .pv{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prop-btn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;border:1px solid var(--border-strong);font-size:13px;color:var(--text-soft)}
.prop-btn:hover{background:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-strong);border-radius:20px;padding:3px 10px;font-size:12.5px}
.section-h{font-weight:700;font-size:13px;margin:16px 0 4px;display:flex;align-items:center;gap:6px}
.comment{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.comment .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.comment .c-meta{font-size:11px;color:var(--text-faint);margin-bottom:2px}
.comment .c-text{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.comment .c-del{opacity:0;margin-left:auto;color:var(--text-faint);width:24px;height:24px;border-radius:5px}
.comment:hover .c-del{opacity:.6}
.comment-box{display:flex;gap:8px;margin-top:10px}
.comment-box textarea{flex:1;border:1px solid var(--border-strong);border-radius:9px;padding:8px 10px;outline:none;resize:vertical;min-height:38px;background:var(--bg-alt)}

/* command palette */
.cmdk-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px}
.cmdk{background:var(--bg);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden}
.cmdk-input{width:100%;padding:16px 18px;border:none;outline:none;font-size:16px;background:transparent;border-bottom:1px solid var(--border)}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.cmdk-item.sel{background:var(--sel)}
.cmdk-item svg{width:17px;height:17px;color:var(--text-soft)}
.cmdk-item .ci-hint{margin-left:auto;font-size:11px;color:var(--text-faint)}
.cmdk-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:8px 12px 3px;font-weight:700}

/* pomodoro */
.pomo{position:fixed;right:18px;bottom:18px;z-index:65;background:var(--bg);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px 16px;width:230px}
.pomo-time{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.pomo-task{font-size:12px;color:var(--text-faint);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pomo-ctrl{display:flex;gap:6px;justify-content:center;margin-top:10px}
.pomo-ctrl button{padding:6px 12px;border-radius:8px;background:var(--hover);font-size:13px;font-weight:600}
.pomo-ctrl .go{background:var(--accent);color:#fff}

/* multiselect bar */
.msbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:66;background:#2b2b2b;color:#fff;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:4px;padding:6px 8px}
.msbar .ms-count{padding:0 10px;font-weight:600;font-size:13px}
.msbar button{color:#eee;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:13px}
.msbar button:hover{background:rgba(255,255,255,.12)}
.msbar svg{width:16px;height:16px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:90;display:flex;align-items:center;gap:14px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;pointer-events:auto}
.toast button{color:#ff9d92;font-weight:600}

.scrim{display:none}
@media(max-width:820px){
  .sidebar{position:fixed;z-index:50;height:100dvh;box-shadow:var(--shadow-lg);margin-left:-290px}
  .sidebar.open{margin-left:0}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .topbar .menu-toggle{display:flex}
  .container{padding:0 16px}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}
/* Safe areas: keep content clear of the iPhone status bar / notch & home indicator */
.topbar{padding-top:calc(9px + env(safe-area-inset-top,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px))}

.content{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media(max-width:820px){
  .container{padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}
  .msbar{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .pomo{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(18px + env(safe-area-inset-right,0px))}
}
/* Larger, more readable type on phones */
@media(max-width:820px){
  body{font-size:16px}
  .task{padding-top:10px;padding-bottom:10px}
  .task-title{font-size:16.5px;line-height:1.4}
  .task-desc{font-size:14px}
  .meta-pill,.label-tag,.sub-count,.due,.deadline{font-size:13.5px}
  .meta-pill svg,.label-tag svg,.sub-count svg{width:14px;height:14px}
  .nav-item{font-size:16px;padding-top:9px;padding-bottom:9px}
  .nav-item .ni-count{font-size:13.5px}
  .add-task-btn{font-size:16px}
  .sb-search span{font-size:15px}
  .view-title{font-size:26px}
  .view-sub{font-size:14.5px}
  .section-label{font-size:15px}
  .add-inline-trigger{font-size:15.5px}
  .compose input.c-title{font-size:17.5px}
  .compose textarea.c-desc{font-size:15px}
  .ctool{font-size:14px;padding:6px 11px}
  .btn{font-size:15.5px;padding:9px 16px}
  .pop-item{font-size:16px;padding:10px 11px}
  .pop-title{font-size:12px}
  .topbar{min-height:58px;gap:8px}
  .topbar .crumb{font-size:17px}
  .topbar .crumb b{font-weight:700}
  .topbar .tb-btn{font-size:15.5px;padding:8px 12px}
  .topbar .tb-btn svg{width:19px;height:19px}
  .topbar .icon-btn{width:40px;height:40px}
  .topbar .menu-toggle svg,.topbar .icon-btn svg{width:24px;height:24px}
  .prop-row .pk{font-size:14.5px}
  .prop-btn,.chip{font-size:14.5px}
  .detail-title{font-size:21px}
  .detail-desc{font-size:15px}
  .section-h{font-size:15px}
  .comment .c-text{font-size:15px}
  .board-card .bc-title{font-size:15px}
  .cal-task{font-size:12px}
  .empty-state h3{font-size:19px}
  .hint{font-size:12.5px}
}
</style>

<script>
"use strict";
/* ============ TASKY v2 — full task manager, offline-first ============ */
const STORE_KEY="tasky.data.v2", THEME_KEY="tasky.theme", ACCENT_KEY="tasky.accent";
const PALETTE=["#dc4c3e","#eb8909","#f9c22e","#7ecc49","#299438","#6accbc","#158fad","#14aaf5","#4073ff","#884dff","#af38eb","#eb96eb","#e05194","#ff8d85","#808080","#b8b8b8","#ccac93"];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYMD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function ymdPlus(n,base){ const b=base?parseYMD(base):new Date(); return todayStr(new Date(b.getTime()+n*864e5)); }
function dayDiff(ymd){ return Math.round((parseYMD(ymd)-parseYMD(todayStr()))/864e5); }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function seed(){
  const inbox={id:"inbox",name:"Inbox",color:"#808080",parentId:null,builtin:true,sections:[],order:0,collapsed:false,boardView:false};
  const work={id:uid(),name:"Work",color:"#4073ff",parentId:null,favorite:true,order:1,collapsed:false,boardView:false,sections:[{id:uid(),name:"To do"},{id:uid(),name:"Doing"},{id:uid(),name:"Done"}]};
  const design={id:uid(),name:"Design",color:"#af38eb",parentId:work.id,order:2,collapsed:false,boardView:false,sections:[]};
  const home={id:uid(),name:"Personal",color:"#299438",parentId:null,order:3,collapsed:false,boardView:false,sections:[]};
  const l1={id:uid(),name:"urgent",color:"#dc4c3e"}, l2={id:uid(),name:"email",color:"#14aaf5"}, l3={id:uid(),name:"errand",color:"#7ecc49"};
  const f1={id:uid(),name:"Priority 1",query:"p1",color:"#dc4c3e",favorite:true};
  const f2={id:uid(),name:"Overdue",query:"overdue",color:"#eb8909"};
  const T=todayStr(), TM=ymdPlus(1);
  let o=0; const mk=x=>Object.assign({id:uid(),title:"",desc:"",done:false,projectId:"inbox",sectionId:null,parentId:null,priority:4,due:null,dueTime:null,deadline:null,duration:null,recur:null,labels:[],comments:[],reminders:[],order:o++,created:Date.now()},x);
  const t1=mk({title:"Welcome to Tasky 👋 — click to open",desc:"This is the task detail view: description, dates, priority, labels, subtasks, comments and reminders all live here.",projectId:"inbox",due:T,priority:4});
  const tasks=[
    t1,
    mk({title:"Plan the week",projectId:work.id,sectionId:work.sections[0].id,priority:2,due:T,labels:[l1.id]}),
    mk({title:"Reply to client email",projectId:work.id,sectionId:work.sections[1].id,priority:3,due:TM,dueTime:"09:30",labels:[l2.id]}),
    mk({title:"Ship release notes",projectId:work.id,sectionId:work.sections[1].id,priority:1,due:T,deadline:ymdPlus(2)}),
    mk({title:"Weekly review",projectId:work.id,priority:4,due:T,recur:"every week"}),
    mk({title:"Buy groceries",projectId:home.id,priority:4,due:TM,labels:[l3.id]}),
    mk({title:"Water the plants",projectId:home.id,priority:4,due:T,recur:"every 3 days"}),
    mk({title:"Morning run",projectId:home.id,priority:4,due:T,done:true,completedAt:Date.now(),recur:"every day"}),
  ];
  // a subtask under t1
  tasks.push(mk({title:"Try checking me off",parentId:t1.id,projectId:"inbox",done:true,completedAt:Date.now()}));
  tasks.push(mk({title:"Add your own task with +",parentId:t1.id,projectId:"inbox"}));
  return {projects:[inbox,work,design,home],labels:[l1,l2,l3],filters:[f1,f2],tasks,
    settings:{dailyGoal:5,pomoWork:25,pomoBreak:5,reminderNotif:true},
    ui:{projCollapsed:false,filterCollapsed:false,labelCollapsed:false,sort:{},group:{}}};
}
function load(){ try{ const r=localStorage.getItem(STORE_KEY); if(r){ const d=JSON.parse(r); if(d&&d.projects) return migrate(d); } }catch(e){ console.warn(e); } const s=seed(); save(s); return s; }
function migrate(d){ d.filters=d.filters||[]; d.settings=Object.assign({dailyGoal:5,pomoWork:25,pomoBreak:5,reminderNotif:true},d.settings||{}); d.ui=Object.assign({projCollapsed:false,filterCollapsed:false,labelCollapsed:false,sort:{},group:{}},d.ui||{}); d.tasks.forEach(t=>{ t.comments=t.comments||[];t.reminders=t.reminders||[];t.parentId=t.parentId||null;t.dueTime=t.dueTime||null;t.deadline=t.deadline||null;t.duration=t.duration||null;t.recur=t.recur||null; if(t.subtasks&&t.subtasks.length){ t.subtasks.forEach((s,i)=>{ d.tasks.push({id:s.id||uid(),title:s.title,desc:"",done:!!s.done,projectId:t.projectId,sectionId:null,parentId:t.id,priority:4,due:null,dueTime:null,deadline:null,duration:null,recur:null,labels:[],comments:[],reminders:[],order:i,created:Date.now(),completedAt:s.done?Date.now():null}); }); delete t.subtasks; } }); d.projects.forEach(p=>{ p.parentId=p.parentId||null; p.sections=p.sections||[]; if(p.boardView===undefined) p.boardView=false; }); return d; }
function save(s){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(s||state)); }catch(e){ toast("Couldn't save — storage full or blocked"); } }
function persist(){ save(state); }
let state=load();

/* lookups */
const P=id=>state.projects.find(p=>p.id===id);
const L=id=>state.labels.find(l=>l.id===id);
const F=id=>state.filters.find(f=>f.id===id);
const TASK=id=>state.tasks.find(t=>t.id===id);
function projName(id){ const p=P(id); return p?p.name:"Inbox"; }
function projColor(id){ const p=P(id); return p?p.color:"#808080"; }
function childrenOf(pid){ return state.tasks.filter(t=>t.parentId===pid); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
window.__TASKY_READY=false;

/* ============ date / recurrence ============ */
function fmtDue(ymd,time){
  if(!ymd) return "";
  const diff=dayDiff(ymd), d=parseYMD(ymd); let s;
  if(diff===0) s="Today"; else if(diff===1) s="Tomorrow"; else if(diff===-1) s="Yesterday";
  else if(diff>1&&diff<7) s=WD[d.getDay()]; else if(diff<-1&&diff>-7) s="Last "+WD[d.getDay()];
  else { const y=d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""; s=MON[d.getMonth()]+" "+d.getDate()+y; }
  if(time) s+=" "+fmtTime(time);
  return s;
}
function fmtTime(t){ if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+(m?":"+String(m).padStart(2,"0"):"")+" "+ap; }
function dueClass(ymd){ if(!ymd) return ""; const diff=dayDiff(ymd); if(diff<0) return "overdue"; if(diff===0) return "today"; if(diff===1) return "soon"; return ""; }
function dueLong(ymd){ const d=parseYMD(ymd); return WD[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); }

// Recurrence: returns next ymd after completing a task due on `from`
function nextRecur(rule,from){
  if(!rule) return null; rule=rule.toLowerCase().trim(); const base=from?parseYMD(from):new Date();
  let m;
  if(/every day|daily/.test(rule)) return ymdPlus(1,todayStr(base));
  if((m=rule.match(/every (\d+) days?/))) return ymdPlus(+m[1],todayStr(base));
  if(/every week|weekly/.test(rule)) return ymdPlus(7,todayStr(base));
  if((m=rule.match(/every (\d+) weeks?/))) return ymdPlus(7*+m[1],todayStr(base));

function parseQuick(raw){

  const dm=title.match(/\+(\d+)\s*(m|min|h|hr|hour)s?\b/i); if(dm){ duration=+dm[1]*(/^h/i.test(dm[2])?60:1); title=title.replace(dm[0]," "); }

  const projM=title.match(/#([\w-]+)(?:\s*\/\s*([\w \-]+?))?(?=\s|$)/);
  if(projM){ const p=state.projects.find(x=>x.name.toLowerCase()===projM[1].toLowerCase().replace(/-/g," ")||x.name.toLowerCase()===projM[1].toLowerCase()); if(p){ projectId=p.id; if(projM[2]){ const sec=(p.sections||[]).find(s=>s.name.toLowerCase()===projM[2].trim().toLowerCase()); if(sec) sectionId=sec.id; } title=title.replace(projM[0]," "); } }

function extractDate(text){

  let m;
  if((m=text.match(/\btoday\b/i))) return {ymd:todayStr(),rest:strip(text,m)};
  if((m=text.match(/\btomorrow\b|\btmr\b|\btom\b/i))) return {ymd:ymdPlus(1),rest:strip(text,m)};
  if((m=text.match(/\byesterday\b/i))) return {ymd:ymdPlus(-1),rest:strip(text,m)};
  if((m=text.match(/\bnext week\b/i))) return {ymd:ymdPlus(7),rest:strip(text,m)};
  if((m=text.match(/\bin (\d+) (day|week|month)s?\b/i))){ const n=+m[1]*(m[2].toLowerCase()==="week"?7:m[2].toLowerCase()==="month"?30:1); return {ymd:ymdPlus(n),rest:strip(text,m)}; }

  if((m=text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?\b/i))){ const mo=MON.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase()); const y=m[3]?+m[3]:new Date().getFullYear(); return {ymd:todayStr(new Date(y,mo,+m[2])),rest:strip(text,m)}; }

}

function _matchToken(tok,t){

  if(tok==="overdue") return t.due&&dayDiff(t.due)<0&&!t.done;
  if(tok==="tomorrow") return t.due&&dayDiff(t.due)===1;
  if(tok==="upcoming"||tok==="next 7 days"||tok==="7 days") return t.due&&dayDiff(t.due)>=0&&dayDiff(t.due)<=7;
  if(tok==="no date"||tok==="no due date") return !t.due;
  if(tok==="no labels") return !(t.labels&&t.labels.length);
  if(tok==="has label"||tok==="labels") return t.labels&&t.labels.length>0;
  if(tok==="recurring") return !!t.recur;

  if(tok==="has deadline"||tok==="deadline") return !!t.deadline;

function dispActiveCount(){ const d=getDisp(); let n=0; if(d.layout!=="list")n++; if(d.showCompleted)n++; if(d.grouping!=="none")n++; if(d.sorting!=="manual")n++; ["fDate","fDeadline","fPriority","fLabel"].forEach(k=>{ if(d[k]!=="all")n++; }); return n; }

function displayFilter(t){
  const d=getDisp();

    if(d.fDate==="today"&&!(t.due&&dayDiff(t.due)<=0)) return false;
    if(d.fDate==="upcoming"&&!(t.due&&dayDiff(t.due)>0)) return false;
    if(d.fDate==="overdue"&&!(t.due&&dayDiff(t.due)<0)) return false;
    if(d.fDate==="nodate"&&t.due) return false;
  }
  if(d.fDeadline!=="all"){

function sortKey(){ return getDisp().sorting; }

function applySort(list){

function toggleDone(t){
  if(!t.done){
    // recurring -> advance instead of completing permanently
    if(t.recur){
      const next=nextRecur(t.recur,t.due||todayStr());
      // log a completion for stats
      logCompletion();
      t.due=next; if(t.deadline){ const dd=dayDiff(t.deadline); } persist(); renderMain();
      toast("Recurring task moved to "+fmtDue(next));
      return;
    }
    t.done=true; t.completedAt=Date.now(); logCompletion(); persist();
    // complete children too
    childrenOf(t.id).forEach(k=>{ if(!k.done){ k.done=true; k.completedAt=Date.now(); } });
    renderMain();
    toastUndo("Task completed",()=>{ t.done=false; t.completedAt=null; persist(); renderMain(); });
  } else {
    t.done=false; t.completedAt=null; persist(); renderMain();
  }
}

function deleteTask(t){

  const walk=(p,depth)=>{ items.push({icon:`<span class="proj-dot" style="background:${p.color};margin-left:${depth*10}px"></span>`,label:p.name,right:(curProj===p.id&&!curSec)?"✓":"",fn:()=>cb(p.id,null)}); (p.sections||[]).forEach(s=>items.push({icon:`<span style="width:17px"></span>`,label:"  ↳ "+s.name,right:(curProj===p.id&&curSec===s.id)?"✓":"",fn:()=>cb(p.id,s.id)})); state.projects.filter(c=>c.parentId===p.id).forEach(c=>walk(c,depth+1)); };
  state.projects.filter(p=>!p.parentId&&!p.archived).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(p=>walk(p,0));
  popMenu(anchor,items);
}
function reminderMenu(anchor,t){
  const add=(mins,ymd,tm)=>{ requestNotif(); let when; if(ymd){ when=parseYMD(ymd).getTime()+ (tm?(parseInt(tm)*3600000+parseInt(tm.split(":")[1])*60000):9*3600000); } else { when=Date.now()+mins*60000; } t.reminders=t.reminders||[]; t.reminders.push({id:uid(),ts:when,fired:false}); persist(); toast("Reminder set"); if(openTaskId===t.id) refreshDetail(); };
  popMenu(anchor,[
    {icon:icoReminder,label:"In 30 minutes",fn:()=>add(30)},
    {icon:icoReminder,label:"In 1 hour",fn:()=>add(60)},
    {icon:icoReminder,label:"In 3 hours",fn:()=>add(180)},
    {icon:icoReminder,label:"Tomorrow 9 AM",fn:()=>add(null,ymdPlus(1),"09:00")},
    {icon:icoReminder,label:t.due?"On due date"+(t.dueTime?" "+fmtTime(t.dueTime):" 9 AM"):"Set a due date first",disabled:!t.due,fn:()=>{ if(t.due) add(null,t.due,t.dueTime||"09:00"); }},
  ]);
}

function deleteProject(p){
  const kids=state.projects.filter(x=>x.parentId===p.id);
  const n=state.tasks.filter(t=>t.projectId===p.id).length;
  if(n||kids.length){ if(!confirm(`Delete "${p.name}"? Its ${n} task(s) move to Inbox`+(kids.length?` and ${kids.length} sub-project(s) will be deleted`:"")+".")) return; }
  const toDel=new Set([p.id]); const collect=id=>state.projects.filter(x=>x.parentId===id).forEach(c=>{toDel.add(c.id);collect(c.id);}); collect(p.id);
  state.tasks.forEach(t=>{ if(toDel.has(t.projectId)){ t.projectId="inbox"; t.sectionId=null; } });
  state.projects=state.projects.filter(x=>!toDel.has(x.id));
  persist(); if(view.type==="project"&&toDel.has(view.id)) setView("today"); else renderAll();
}

/* ============ popover engine ============ */
let popEl=null,popBd=null;
function closePop(){ if(popEl){popEl.remove();popEl=null;} if(popBd){popBd.remove();popBd=null;} }
function popMenu(anchor,items,...builders){
  closePop();
  popBd=document.createElement("div"); popBd.className="pop-backdrop"; popBd.onclick=closePop; document.body.appendChild(popBd);
  popEl=document.createElement("div"); popEl.className="popover"; let bi=0;
  items.forEach(it=>{
    if(it.sep){ const d=document.createElement("div"); d.className="pop-div"; popEl.appendChild(d); return; }
    if(it.custom){ const b=builders[bi++]; if(b) popEl.appendChild(b(popEl)); return; }
    if(it.disabled){ const d=document.createElement("div"); d.className="pop-item"; d.style.opacity=".5"; d.style.cursor="default"; d.innerHTML=`${it.icon?`<span style="display:flex;width:18px">${it.icon}</span>`:""}<span>${esc(it.label)}</span>`; popEl.appendChild(d); return; }
    const b=document.createElement("button"); b.className="pop-item"+(it.danger?" danger":"");
    b.innerHTML=`${it.icon?`<span style="display:flex;width:18px;height:18px">${it.icon}</span>`:""}<span>${esc(it.label)}</span>${it.right?`<span class="pi-right">${it.right}</span>`:""}`;
    b.onclick=()=>{ const keep=it.keepOpen; const ref=popEl; if(!keep) closePop(); it.fn&&it.fn(ref); };
    popEl.appendChild(b);
  });
  document.body.appendChild(popEl); positionPop(anchor);
}
function atPoint(x,y){ return {getBoundingClientRect:()=>({left:x,top:y,bottom:y,right:x,width:0,height:0})}; }
function positionPop(anchor){
  const r=anchor.getBoundingClientRect(),pr=popEl.getBoundingClientRect();
  let top=r.bottom+6,left=r.left;
  if(left+pr.width>innerWidth-8) left=innerWidth-pr.width-8;
  if(left<8) left=8;
  if(top+pr.height>innerHeight-8) top=Math.max(8,r.top-pr.height-6);
  popEl.style.top=top+"px"; popEl.style.left=left+"px";
}
function openInputPop(anchor,title,ph,cb,clearAfter,initial){
  closePop();
  popBd=document.createElement("div"); popBd.className="pop-backdrop"; popBd.onclick=closePop; document.body.appendChild(popBd);
  popEl=document.createElement("div"); popEl.className="popover"; popEl.style.minWidth="250px";
  popEl.innerHTML=`<div class="pop-title">${esc(title)}</div>`;
  const inp=document.createElement("input"); inp.className="pop-input"; inp.placeholder=ph; if(initial) inp.value=initial;
  const row=document.createElement("div"); row.style.cssText="display:flex;gap:6px;justify-content:flex-end";
  row.innerHTML=`<button class="btn btn-ghost pc-cancel">Cancel</button><button class="btn btn-primary pc-ok">Save</button>`;
  popEl.append(inp,row); document.body.appendChild(popEl); positionPop(anchor); inp.focus(); if(inp.select) inp.select();
  const ok=()=>{ cb(inp.value); if(clearAfter) inp.value=""; closePop(); };
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();ok();} if(e.key==="Escape") closePop(); };
  row.querySelector(".pc-ok").onclick=ok; row.querySelector(".pc-cancel").onclick=closePop;
}
function colorPop(anchor,current,cb){
  closePop();

/* ============ drag & drop ============ */
let dragId=null,dropChild=false;
function enableDrag(container,projectId,sectionId,parentId){
  const rows=[...container.children].filter(x=>x.querySelector&&x.querySelector(":scope > .task"));
  [...container.querySelectorAll(":scope > div > .task")].forEach(el=>{
    const handle=el.querySelector(".drag-handle");
    if(handle) handle.onmousedown=()=>{ el.draggable=true; };
    el.ondragstart=e=>{ dragId=el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.stopPropagation(); };
    el.ondragend=()=>{ el.classList.remove("dragging"); el.draggable=false; container.querySelectorAll(".task").forEach(x=>x.classList.remove("drop-above","drop-child")); };
    el.ondragover=e=>{ e.preventDefault(); container.querySelectorAll(".task").forEach(x=>x.classList.remove("drop-above","drop-child")); const rect=el.getBoundingClientRect(); dropChild=(e.clientX-rect.left)>52; el.classList.add(dropChild?"drop-child":"drop-above"); };
    el.ondrop=e=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove("drop-above","drop-child"); if(!dragId||dragId===el.dataset.id) return; const drag=TASK(dragId),tgt=TASK(el.dataset.id); if(!drag||!tgt) return; if(dropChild){ if(isAncestor(drag.id,tgt.id)) return; drag.parentId=tgt.id; drag.projectId=tgt.projectId; drag.sectionId=tgt.sectionId; tgt._expanded=true; } else { drag.parentId=tgt.parentId; drag.projectId=tgt.projectId; drag.sectionId=tgt.sectionId; reorderBefore(drag,tgt); } persist(); renderMain(); };
  });
  container.ondragover=e=>{ e.preventDefault(); };
  container.ondrop=e=>{ if(e.target===container&&dragId){ const drag=TASK(dragId); if(drag){ drag.parentId=parentId||null; drag.projectId=projectId||(parentId?TASK(parentId).projectId:"inbox"); drag.sectionId=sectionId||null; persist(); renderMain(); } } };
}
function isAncestor(aId,bId){ let cur=TASK(bId); while(cur){ if(cur.parentId===aId) return true; cur=cur.parentId?TASK(cur.parentId):null; } return false; }
function reorderBefore(drag,tgt){ const sibs=state.tasks.filter(t=>t.parentId===tgt.parentId&&t.projectId===tgt.projectId&&t.sectionId===tgt.sectionId&&t.id!==drag.id).sort((a,b)=>(a.order||0)-(b.order||0)); const idx=sibs.findIndex(t=>t.id===tgt.id); sibs.splice(idx<0?sibs.length:idx,0,drag); sibs.forEach((t,i)=>t.order=i); }

/* ============ dashboard ============ */
function renderDashboard(root){
  state.stats=state.stats||{log:{}}; const log=state.stats.log||{};
  // rebuild-ish: also count done tasks by completedAt for accuracy
  const doneByDay={}; state.tasks.forEach(t=>{ if(t.done&&t.completedAt){ const k=todayStr(new Date(t.completedAt)); doneByDay[k]=(doneByDay[k]||0)+1; } });
  const merged={}; Object.keys(log).forEach(k=>merged[k]=(merged[k]||0)+log[k]); Object.keys(doneByDay).forEach(k=>merged[k]=Math.max(merged[k]||0,doneByDay[k]));
  const todayN=merged[todayStr()]||0; const goal=state.settings.dailyGoal||5;
  // streak
  let streak=0; for(let i=0;i<400;i++){ const k=ymdPlus(-i); if((merged[k]||0)>0){ if(i===0||streak>0||i===1) streak++; else break; } else { if(i===0) continue; break; } }
  // simpler streak: consecutive days up to today with >=1
  streak=0; for(let i=0;i<400;i++){ const k=ymdPlus(-i); if((merged[k]||0)>0) streak++; else if(i>0) break; else break; }
  const total=state.tasks.filter(t=>t.done).length;
  const week=[]; for(let i=6;i>=0;i--){ const k=ymdPlus(-i); week.push({k,n:merged[k]||0,d:parseYMD(k)}); }
  const weekTotal=week.reduce((a,b)=>a+b.n,0); const maxW=Math.max(1,...week.map(w=>w.n));
  const head=document.createElement("div"); head.className="view-head"; head.innerHTML=`<div class="view-title">Productivity</div><div class="view-sub">Your task momentum</div>`; root.appendChild(head);
  const grid=document.createElement("div"); grid.className="dash-grid";
  grid.innerHTML=`
    <div class="card"><h4>Completed today</h4><div class="stat-big">${todayN}</div><div class="goal-row"><div style="flex:1;height:8px;background:var(--hover);border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.min(100,todayN/goal*100)}%;background:var(--accent)"></div></div><span class="stat-sub" style="margin:0">${todayN}/${goal}</span></div><div class="stat-sub">Daily goal ${todayN>=goal?"reached 🎉":""}</div></div>
    <div class="card"><h4>Current streak</h4><div class="stat-big">${streak}<span style="font-size:16px;font-weight:600;color:var(--text-faint)"> day${streak!==1?"s":""}</span></div><div class="stat-sub">Keep it going!</div></div>
    <div class="card"><h4>This week</h4><div class="stat-big">${weekTotal}</div><div class="stat-sub">tasks completed</div></div>
    <div class="card"><h4>All-time</h4><div class="stat-big">${total}</div><div class="stat-sub">tasks completed</div></div>`;
  root.appendChild(grid);
  // week bar chart
  const chart=document.createElement("div"); chart.className="card"; chart.style.marginTop="14px";
  chart.innerHTML=`<h4>Last 7 days</h4><div class="bars">${week.map(w=>`<div class="bar" style="height:${w.n/maxW*100}%"><span>${WD[w.d.getDay()]}</span></div>`).join("")}</div><div style="height:16px"></div>`;
  root.appendChild(chart);
  // heatmap (last ~15 weeks)
  const heatCard=document.createElement("div"); heatCard.className="card"; heatCard.style.marginTop="14px";
  const weeks=15; const cells=[]; const start=new Date(); start.setDate(start.getDate()-(weeks*7-1));
  let maxH=1; for(let i=0;i<weeks*7;i++){ const d=new Date(start.getTime()+i*864e5); const k=todayStr(d); const n=merged[k]||0; maxH=Math.max(maxH,n); cells.push({k,n}); }
  const color=n=>{ if(!n) return "var(--hover)"; const a=Math.min(1,.25+n/maxH*.75); return `color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, transparent)`; };
  heatCard.innerHTML=`<h4>Activity heatmap</h4><div class="heat">${cells.map(c=>`<div class="heat-cell" title="${c.k}: ${c.n}" style="background:${color(c.n)}"></div>`).join("")}</div>`;
  root.appendChild(heatCard);
  // by project
  const byProj={}; state.tasks.filter(t=>t.done).forEach(t=>{ byProj[t.projectId]=(byProj[t.projectId]||0)+1; });
  const rows=Object.entries(byProj).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(rows.length){ const pc=document.createElement("div"); pc.className="card"; pc.style.marginTop="14px"; const maxP=Math.max(1,...rows.map(r=>r[1])); pc.innerHTML=`<h4>Completed by project</h4>${rows.map(([pid,n])=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span class="proj-dot" style="background:${projColor(pid)}"></span><span style="width:110px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(projName(pid))}</span><div style="flex:1;height:8px;background:var(--hover);border-radius:5px;overflow:hidden"><div style="height:100%;width:${n/maxP*100}%;background:${projColor(pid)}"></div></div><span class="stat-sub" style="margin:0">${n}</span></div>`).join("")}`; root.appendChild(pc); }
  // goal setter
  const gc=document.createElement("div"); gc.className="card"; gc.style.marginTop="14px";
  gc.innerHTML=`<h4>Daily goal</h4><div class="goal-row"><input type="range" min="1" max="20" value="${goal}" style="flex:1"><span class="stat-big" style="font-size:20px" id="goalVal">${goal}</span></div>`;
  root.appendChild(gc);
  const sl=gc.querySelector("input"); sl.oninput=()=>{ gc.querySelector("#goalVal").textContent=sl.value; }; sl.onchange=()=>{ state.settings.dailyGoal=+sl.value; persist(); renderMain(); };
}

let pomo=null,pomoTimer=null;
function startPomo(taskId){
  const t=taskId?TASK(taskId):null;
  pomo={taskId,mode:"work",remaining:(state.settings.pomoWork||25)*60,running:true};
  renderPomo(); tickPomo();
}
function tickPomo(){ clearInterval(pomoTimer); pomoTimer=setInterval(()=>{ if(!pomo||!pomo.running) return; pomo.remaining--; if(pomo.remaining<=0){ if(pomo.mode==="work"){ notify("Focus session done","Time for a break."); pomo.mode="break"; pomo.remaining=(state.settings.pomoBreak||5)*60; } else { notify("Break over","Back to it!"); pomo.mode="work"; pomo.remaining=(state.settings.pomoWork||25)*60; pomo.running=false; } } renderPomo(); },1000); }
function renderPomo(){ const m=document.getElementById("pomoMount"); if(!pomo){ m.innerHTML=""; clearInterval(pomoTimer); return; } const t=pomo.taskId?TASK(pomo.taskId):null; const mm=String(Math.floor(pomo.remaining/60)).padStart(2,"0"),ss=String(pomo.remaining%60).padStart(2,"0"); m.innerHTML=`<div class="pomo"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);text-align:center;font-weight:700">${pomo.mode==="work"?"Focus":"Break"}</div><div class="pomo-time">${mm}:${ss}</div>${t?`<div class="pomo-task">${esc(t.title)}</div>`:""}<div class="pomo-ctrl"><button class="go p-toggle">${pomo.running?"Pause":"Start"}</button><button class="p-reset">Reset</button><button class="p-close">✕</button></div></div>`; m.querySelector(".p-toggle").onclick=()=>{ pomo.running=!pomo.running; renderPomo(); }; m.querySelector(".p-reset").onclick=()=>{ pomo.remaining=(pomo.mode==="work"?(state.settings.pomoWork||25):(state.settings.pomoBreak||5))*60; renderPomo(); }; m.querySelector(".p-close").onclick=()=>{ pomo=null; renderPomo(); }; }

/* ============ reminders & notifications ============ */
function requestNotif(){ if("Notification" in window && Notification.permission==="default"){ Notification.requestPermission(); } }
function notify(title,body){ try{ if("Notification" in window && Notification.permission==="granted"){ new Notification(title,{body}); return; } }catch(e){} toast(title+(body?" — "+body:"")); }
function checkReminders(){ const now=Date.now(); let changed=false; state.tasks.forEach(t=>{ (t.reminders||[]).forEach(r=>{ if(!r.fired&&r.ts<=now){ r.fired=true; changed=true; notify("⏰ "+t.title, t.due?("Due "+fmtDue(t.due,t.dueTime)):"Reminder"); } }); }); if(changed) persist(); }
/* ============ search ============ */
function openSearch(){
  closePop();
  popBd=document.createElement("div"); popBd.className="pop-backdrop"; popBd.onclick=closePop; document.body.appendChild(popBd);
  popEl=document.createElement("div"); popEl.className="popover"; popEl.style.minWidth="300px";
  const inp=document.createElement("input"); inp.className="pop-input"; inp.placeholder="Search all tasks…"; inp.style.margin="0";
  if(view.type==="search") inp.value=searchQuery;
  popEl.appendChild(inp); const anchor=document.getElementById("sbSearch"); document.body.appendChild(popEl); positionPop(anchor); inp.focus();
  inp.oninput=()=>{ searchQuery=inp.value; };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ searchQuery=inp.value; closePop(); setView("search"); } if(e.key==="Escape") closePop(); };
}

/* ============ Display panel ============ */
function openDisplayPanel(){
  const d=getDisp(); closePop();
  popBd=document.createElement("div"); popBd.className="pop-backdrop"; popBd.onclick=closePop; document.body.appendChild(popBd);
  popEl=document.createElement("div"); popEl.className="popover"; popEl.style.cssText="width:330px;max-width:92vw;padding:12px";
  const opt=(v,cur,label)=>`<option value="${v}" ${v===cur?"selected":""}>${label}</option>`;
  const labelOpts=state.labels.map(l=>opt(l.id,d.fLabel,l.name)).join("");
  popEl.innerHTML=`
    <div style="font-weight:700;margin:2px 2px 8px">Layout</div>
    <div class="seg" style="width:100%;margin-bottom:6px">
      <button data-l="list" class="${d.layout==='list'?'on':''}" style="flex:1">List</button>
      <button data-l="board" class="${d.layout==='board'?'on':''}" style="flex:1">Board</button>
      <button data-l="calendar" class="${d.layout==='calendar'?'on':''}" style="flex:1">Calendar</button>
    </div>
    <div class="disp-row" style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px"><span>Show completed tasks</span><label class="switch"><input type="checkbox" class="d-comp" ${d.showCompleted?"checked":""}><span class="sl"></span></label></div>
    <div style="font-weight:700;margin:10px 2px 2px">Sort</div>
    <div class="disp-row"><span>Grouping</span><select class="d-group">
      ${opt("none",d.grouping,"None")}${opt("date",d.grouping,"Date")}${opt("priority",d.grouping,"Priority")}${opt("project",d.grouping,"Project")}${opt("label",d.grouping,"Label")}
    </select></div>
    <div class="disp-row"><span>Sorting</span><select class="d-sort">
      ${opt("manual",d.sorting,"Default (manual)")}${opt("due",d.sorting,"Due date")}${opt("priority",d.sorting,"Priority")}${opt("name",d.sorting,"Name")}${opt("added",d.sorting,"Date added")}${opt("project",d.sorting,"Project")}
    </select></div>
    <div style="font-weight:700;margin:10px 2px 2px">Filter</div>
    <div class="disp-row"><span>Date</span><select class="d-fdate">
      ${opt("all",d.fDate,"All")}${opt("today",d.fDate,"Today & earlier")}${opt("upcoming",d.fDate,"Upcoming")}${opt("overdue",d.fDate,"Overdue")}${opt("nodate",d.fDate,"No date")}
    </select></div>
    <div class="disp-row"><span>Deadline</span><select class="d-fdead">
      ${opt("all",d.fDeadline,"All")}${opt("has",d.fDeadline,"Has deadline")}${opt("overdue",d.fDeadline,"Overdue")}${opt("no",d.fDeadline,"No deadline")}
    </select></div>
    <div class="disp-row"><span>Priority</span><select class="d-fpri">
      ${opt("all",d.fPriority,"All")}${opt("1",d.fPriority,"Priority 1")}${opt("2",d.fPriority,"Priority 2")}${opt("3",d.fPriority,"Priority 3")}${opt("4",d.fPriority,"No priority")}
    </select></div>
    <div class="disp-row"><span>Label</span><select class="d-flabel">${opt("all",d.fLabel,"All")}${labelOpts}</select></div>
    <div style="text-align:center;margin-top:10px;border-top:1px solid var(--border);padding-top:8px"><button class="d-reset" style="color:var(--accent);font-weight:600;padding:6px 12px">Reset all</button></div>`;
  document.body.appendChild(popEl); positionPop(document.getElementById("sortBtn"));
  const set=(patch)=>{ Object.assign(d,patch); if(patch.layout!==undefined&&view.type==="project"&&P(view.id)) P(view.id).boardView=(patch.layout==="board"); persist(); renderMain(); openDisplayPanel(); };
  popEl.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>set({layout:b.dataset.l}));
  popEl.querySelector(".d-comp").onchange=e=>set({showCompleted:e.target.checked});
  popEl.querySelector(".d-group").onchange=e=>set({grouping:e.target.value});
  popEl.querySelector(".d-sort").onchange=e=>set({sorting:e.target.value});
  popEl.querySelector(".d-fdate").onchange=e=>set({fDate:e.target.value});
  popEl.querySelector(".d-fdead").onchange=e=>set({fDeadline:e.target.value});
  popEl.querySelector(".d-fpri").onchange=e=>set({fPriority:e.target.value});
  popEl.querySelector(".d-flabel").onchange=e=>set({fLabel:e.target.value});
  popEl.querySelector(".d-reset").onclick=()=>{ closePop(); resetDisp(); };
}
function viewMoreMenu(anchor){
  const items=[];
  if(selection.size===0) items.push({icon:icoSelect,label:"Select tasks",fn:()=>{ document.body.classList.add("multiselect"); renderMain(); toast("Tap tasks to select"); }});
  if(view.type==="project"){ const p=P(view.id); items.push({icon:icoPlus,label:"Add section",fn:()=>addSection(p)}); }
  items.push({icon:icoDown,label:"Export backup",fn:exportData});
  popMenu(anchor,items);
}

/* ============ settings / data menu ============ */
function settingsMenu(anchor){
  popMenu(anchor,[
    {custom:"accent"},
    {sep:true},
    {icon:icoDown,label:"Export backup (.json)",fn:exportData},
    {icon:icoUp,label:"Import backup",fn:importData},
    {icon:icoReminder,label:(("Notification" in window)&&Notification.permission==="granted")?"Notifications on":"Enable notifications",fn:()=>{ requestNotif(); }},
    {sep:true},
    {icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>`,label:"About sync & devices",fn:aboutSync},
    {icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16" stroke-linecap="round"/></svg>`,label:"Keyboard shortcuts",fn:showShortcuts},
    {sep:true},
    {icon:icoTrash,label:"Clear all data",danger:true,fn:()=>{ if(confirm("Delete ALL data? Export a backup first — this cannot be undone.")){ localStorage.removeItem(STORE_KEY); state=load(); setView("today"); } }},
  ],pop=>{
    const wrap=document.createElement("div"); wrap.style.padding="4px 8px";
    wrap.innerHTML=`<div class="pop-title" style="padding-left:0">Accent color</div>`;
    const row=document.createElement("div"); row.style.cssText="display:flex;gap:8px;padding:4px 0";
    [["tomato","#dc4c3e"],["blue","#2f6fed"],["violet","#7c4dff"],["green","#0f9d58"],["pink","#e0518f"],["teal","#0f9aa8"]].forEach(([k,c])=>{ const s=document.createElement("div"); s.className="color-swatch"+(document.documentElement.getAttribute("data-accent")===k?" sel":""); s.style.background=c; s.onclick=()=>{ setAccent(k); pop.querySelectorAll(".color-swatch").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); }; row.appendChild(s); });
    wrap.appendChild(row); return wrap;
  });
}
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tasky-backup-"+todayStr()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Backup downloaded"); }
function importData(){ const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json"; inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.projects||!d.tasks) throw 0; if(!confirm("Import will replace current data. Continue? (Export a backup first if unsure.)")) return; state=migrate(d); if(!state.projects.some(p=>p.id==="inbox")) state.projects.unshift({id:"inbox",name:"Inbox",color:"#808080",parentId:null,builtin:true,sections:[],order:0}); persist(); setView("today"); toast("Backup imported"); }catch(e){ toast("Couldn't read that file"); } }; r.readAsText(f); }; inp.click(); }
function aboutSync(){ alert("Tasky stores your data on THIS device, in this browser, and works fully offline.\n\nTo use the same data on another device:\n1. Settings (⋯) → Export backup here.\n2. Open Tasky on the other device → Import backup.\n\nFor automatic real-time sync across devices, Tasky needs a cloud account/server — ask and that can be added."); }
function showShortcuts(){ alert("Keyboard shortcuts\n\n⌘/Ctrl + K   Command palette\nA                    Add task\nF                    Search\nEnter              Add task (in composer) / open task\nEscape           Close / cancel\n1–4                Set priority (in composer via !1–!4)\nT                    Go to Today\nU                    Go to Upcoming\n\nDrag the handle to reorder; drag onto a task's right side to nest it."); }

/* ============ toast ============ */
let toastTimer=null;
function toast(m){ showToast(m,null); }
function toastUndo(m,u){ showToast(m,u); }
function showToast(m,u){ const el=document.getElementById("toast"); el.innerHTML=`<span>${esc(m)}</span>`; if(u){ const b=document.createElement("button"); b.textContent="Undo"; b.onclick=()=>{ u(); el.classList.remove("show"); }; el.appendChild(b); } el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),u?4500:2200); }

/* ============ theme ============ */
function applyTheme(th){ document.documentElement.setAttribute("data-theme",th); try{ localStorage.setItem(THEME_KEY,th); }catch(e){} const ic=document.getElementById("themeIcon"); if(ic) ic.innerHTML=th==="dark"?`<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>`:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`; }
function toggleTheme(){ applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); }
function setAccent(a){ document.documentElement.setAttribute("data-accent",a); try{ localStorage.setItem(ACCENT_KEY,a); }catch(e){} }
function closeSidebarMobile(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").classList.remove("show"); }

/* ============ events ============ */
document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("menuMore").onclick=e=>settingsMenu(e.currentTarget);
document.getElementById("sbAddTask").onclick=()=>{ if(["completed","dashboard","calendar"].includes(view.type)) setView("today"); startCompose(view.type==="project"?view.id:null,null,null); };
document.getElementById("addProjBtn").onclick=e=>{ e.stopPropagation(); addProject(); };
document.getElementById("addFilterBtn").onclick=e=>{ e.stopPropagation(); addFilter(); };
document.getElementById("addLabelBtn").onclick=e=>{ e.stopPropagation(); createLabel(); };
document.getElementById("projHead").onclick=e=>{ if(e.target.closest(".h-btn"))return; state.ui.projCollapsed=!state.ui.projCollapsed; persist(); renderSidebar(); };
document.getElementById("filterHead").onclick=e=>{ if(e.target.closest(".h-btn"))return; state.ui.filterCollapsed=!state.ui.filterCollapsed; persist(); renderSidebar(); };
document.getElementById("labelHead").onclick=e=>{ if(e.target.closest(".h-btn"))return; state.ui.labelCollapsed=!state.ui.labelCollapsed; persist(); renderSidebar(); };
document.getElementById("sbSearch").onclick=openSearch;
document.getElementById("sortBtn").onclick=e=>openDisplayPanel();
document.getElementById("moreView").onclick=e=>viewMoreMenu(e.currentTarget);
document.getElementById("menuToggle").onclick=()=>{ document.getElementById("sidebar").classList.toggle("open"); document.getElementById("scrim").classList.toggle("show"); };
document.getElementById("scrim").onclick=closeSidebarMobile;
window.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
  if(e.key==="Escape"){ if(document.getElementById("cmdkBack")){ closePalette(); return; } if(popEl){ closePop(); return; } if(document.getElementById("modalBd")){ closeModal(); return; } if(selection.size){ clearSelection(); return; } }
  if(e.target.matches("input,textarea")) return;
  if(e.key==="a"||e.key==="A"){ e.preventDefault(); if(["completed","dashboard","calendar"].includes(view.type)) setView("today"); startCompose(view.type==="project"?view.id:null,null,null); }
  if(e.key==="f"||e.key==="F"){ e.preventDefault(); openSearch(); }
  if(e.key==="t"||e.key==="T"){ setView("today"); }
  if(e.key==="u"||e.key==="U"){ setView("upcoming"); }
  if(e.key==="Escape"&&compose) cancelCompose();
});
window.addEventListener("resize",()=>{ if(popEl) closePop(); });

/* ============ boot ============ */
(function init(){
  let th="light"; try{ th=localStorage.getItem(THEME_KEY)|| ((matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"); }catch(e){}
  applyTheme(th);
  let ac="tomato"; try{ ac=localStorage.getItem(ACCENT_KEY)||"tomato"; }catch(e){} setAccent(ac);
  setView("today");
  checkReminders(); setInterval(checkReminders,30000);
  window.__TASKY_READY=true;
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
